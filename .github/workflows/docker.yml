name: Docker Build Validation

on:
  push:
    branches: [main, "deployment/**"]
  pull_request:
    branches: [main]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-risk-model:test .

      - name: Start container
        run: docker run -d --name credit-risk-api -p 5000:5000 credit-risk-model:test

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail http://127.0.0.1:5000/health; then exit 0; fi
            sleep 2
          done
          docker logs credit-risk-api
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:5000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "person_age": 30,
              "person_income": 75000,
              "person_home_ownership": "RENT",
              "person_emp_length": 5,
              "loan_intent": "PERSONAL",
              "loan_grade": "B",
              "loan_amnt": 10000,
              "loan_int_rate": 10.5,
              "loan_percent_income": 0.133,
              "cb_person_default_on_file": "N",
              "cb_person_cred_hist_length": 8
            }')
          echo "$response"
          echo "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert 'default_probability' in d; assert 'risk_level' in d; assert d['risk_level'] in {'LOW','MEDIUM','HIGH'}"

      - name: Container logs
        if: always()
        run: docker logs credit-risk-api
