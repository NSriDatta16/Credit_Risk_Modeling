<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Credit Risk Prediction</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>Credit Risk Prediction</h1>
    <p>Enter applicant and loan details to estimate probability of default.</p>
    <form id="risk-form">
      <input name="person_age" type="number" placeholder="Age" required>
      <input name="person_income" type="number" placeholder="Annual income" required>
      <input name="person_home_ownership" placeholder="Home ownership (RENT/OWN/MORTGAGE/OTHER)" required>
      <input name="person_emp_length" type="number" step="0.1" placeholder="Employment length (years)">
      <input name="loan_intent" placeholder="Loan intent" required>
      <input name="loan_grade" placeholder="Loan grade (A-G)" required>
      <input name="loan_amnt" type="number" placeholder="Loan amount" required>
      <input name="loan_int_rate" type="number" step="0.01" placeholder="Interest rate" required>
      <input name="loan_percent_income" type="number" step="0.001" placeholder="Loan % of income" required>
      <input name="cb_person_default_on_file" placeholder="Historical default (Y/N)" required>
      <input name="cb_person_cred_hist_length" type="number" placeholder="Credit history length" required>
      <button type="submit">Assess Risk</button>
    </form>
    <pre id="result"></pre>
  </main>
  <script>
    const form = document.getElementById('risk-form');
    const result = document.getElementById('result');
    const numeric = new Set(['person_age','person_income','person_emp_length','loan_amnt','loan_int_rate','loan_percent_income','cb_person_cred_hist_length']);
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      for (const key of numeric) if (data[key] !== '') data[key] = Number(data[key]);
      const response = await fetch('/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
      result.textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
